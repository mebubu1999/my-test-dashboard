<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社群數據自動分析中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F9F8F6; --surface: #FFFFFF; --purple: #7C62A3; --border: #E6E1DA; --text: #1C1917; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .sidebar { position: fixed; width: 220px; height: 100vh; background: var(--text); color: #fff; padding: 20px; }
  .main { margin-left: 220px; padding: 30px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .upload-area { border: 2px dashed var(--border); padding: 60px; text-align: center; cursor: pointer; border-radius: 12px; }
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<nav class="sidebar">
  <h1>分析中心</h1>
  <div style="margin-top:20px;">
    <div class="nav-item" onclick="showPage('dashboard')">總覽儀表板</div>
    <div class="nav-item" onclick="showPage('upload')">上傳數據 (CSV)</div>
  </div>
</nav>

<div class="main">
  <div id="page-dashboard" class="page active">
    <div class="card">
      <h2 id="statsTitle">請上傳數據以開始分析</h2>
      <div id="statsContent"></div>
    </div>
  </div>

  <div id="page-upload" class="page">
    <div class="card">
      <div class="upload-area" id="uploadArea">拖曳 CSV 至此 或 點擊上傳</div>
      <input type="file" id="fileInput" accept=".csv" style="display:none">
    </div>
  </div>
</div>

<script>
function parseCSV(text) {
  const lines = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { if (inQ && text[i+1] === '"') { cur += '"'; i++; } else { inQ = !inQ; } }
    else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
    else if ((c === '\r' || c === '\n') && !inQ) {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur.trim()); if(row.some(x=>x)) lines.push(row);
      row = []; cur = '';
    } else { cur += c; }
  }
  const headers = lines[0].map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const obj = {}; headers.forEach((h, i) => obj[h] = line[i] || '');
    return obj;
  });
}

// 核心聰明解析：自動掃描正確欄位
function processCSV(rawRows) {
  const findCol = (row, candidates) => candidates.find(c => row.hasOwnProperty(c) || Object.keys(row).some(k => k.includes(c))) || Object.keys(row).find(k => candidates.some(cand => k.includes(cand)));
  
  const processed = rawRows.map(r => {
    const titleCol = findCol(r, ['標題', '說明', '貼文', '貼文內容']);
    let title = r[titleCol] || '未命名內容';
    // 嚴格過濾掉網址當標題
    if(title.includes('http')) title = '內容摘要';
    
    return {
      title: title.substring(0, 30),
      reach: parseFloat(r[findCol(r, ['觸及人數', '觸及', 'Reach', '觀看秒'])] || 0),
      share: parseFloat(r[findCol(r, ['分享', 'Shares'])] || 0)
    };
  }).filter(r => r.reach > 0);
  
  return processed;
}

document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    const data = processCSV(parseCSV(e.target.result));
    document.getElementById('statsContent').innerText = `成功匯入 ${data.length} 筆貼文，總觸及：${data.reduce((a,b)=>a+b.reach, 0)}`;
    document.getElementById('statsTitle').innerText = "分析完成";
    showPage('dashboard');
  };
  reader.readAsText(file, 'UTF-8');
});

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
}
</script>
</body>
</html>
