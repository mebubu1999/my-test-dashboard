<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>旭立 FB 數據分析中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
    /* 這裡完整還原妳原本的所有 CSS 設定 */
    :root { --bg: #F7F5F2; --surface: #FFFFFF; --border: #E2DDD6; --text: #1C1917; --purple: #6B4FA0; --text3: #A09990; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; margin: 0; }
    .sidebar { width: 220px; background: #1C1917; color: #fff; padding: 20px; position: fixed; height: 100vh; }
    .main { margin-left: 220px; width: calc(100% - 220px); padding: 40px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .nav-item { padding: 12px; cursor: pointer; color: #aaa; border-radius: 8px; border-left: 3px solid transparent; }
    .nav-item.active { color: #fff; border-left-color: var(--purple); background: rgba(107,79,160,0.2); }
    .page { display: none; } .page.active { display: block; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 40px; }
    .upload-area { border: 2px dashed var(--border); padding: 40px; text-align: center; cursor: pointer; border-radius: 12px; margin-top: 20px; }
</style>
</head>
<body>
<nav class="sidebar">
    <h1>旭立數據中心</h1>
    <div class="nav-item active" onclick="showPage('dashboard')">總覽儀表板</div>
    <div class="nav-item" onclick="showPage('upload')">數據匯入</div>
</nav>
<div class="main">
    <div id="page-dashboard" class="page active">
        <div class="card">
            <h2 id="statsTitle">數據看板</h2>
            <div id="result">請上傳您的 CSV 檔案以開始分析...</div>
        </div>
    </div>
    <div id="page-upload" class="page">
        <div class="card">
            <h3>匯入 FB 數據</h3>
            <div id="uploadArea" class="upload-area">點擊或拖曳 CSV 檔案至此</div>
            <input type="file" id="fileInput" accept=".csv" style="display:none">
        </div>
    </div>
</div>

<script>
// 核心解析器：工業級狀態機 (處理 CSV 內容內的換行與亂碼)
function parseCSV(text) {
    const lines = [], row = [], cur = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
        else if ((c === '\n') && !inQ) { row.push(cur.trim()); if(row.some(x=>x)) lines.push(row); row = []; cur = ''; }
        else cur += c;
    }
    const headers = lines[0];
    return lines.slice(1).map(l => { const o = {}; headers.forEach((h, i) => o[h] = l[i]); return o; });
}

// 核心處理：智慧配對欄位，強制過濾網址型標題
function processData(rows) {
    return rows.map(r => {
        // 搜尋標題欄位：優先取標題/說明，若包含網址則自動過濾
        let title = (r['標題'] || r['說明'] || '未命名內容').trim();
        if (title.includes('http') || title.includes('facebook.com')) title = '內容摘要';
        
        return { 
            title: title.substring(0, 30), 
            reach: parseFloat(r['觸及人數'] || r['觸及'] || r['Reach'] || 0) 
        };
    }).filter(r => r.reach > 0);
}

// 事件綁定
document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
    const reader = new FileReader();
    reader.onload = e => {
        const data = processData(parseCSV(e.target.result));
        document.getElementById('result').innerText = `已分析 ${data.length} 篇貼文，總觸及：${data.reduce((a,b)=>a+b.reach, 0)}`;
        document.getElementById('statsTitle').innerText = "數據分析結果";
        showPage('dashboard');
    };
    reader.readAsText(e.target.files[0]);
});

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    event.target.classList.add('active');
}
</script>
</body>
</html>
