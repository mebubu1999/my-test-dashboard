<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>社群數據分析中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F9F8F6; --text: #1C1917; --purple: #7C62A3; --border: #E6E1DA; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); display: flex; margin: 0; }
  .sidebar { width: 220px; height: 100vh; background: #1C1917; color: #fff; padding: 30px 20px; position: fixed; }
  .main { margin-left: 220px; padding: 40px; width: calc(100% - 220px); }
  .card { background: #fff; padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .nav-item { padding: 12px; cursor: pointer; color: #aaa; margin-bottom: 5px; border-radius: 8px; transition: 0.3s; }
  .nav-item.active { color: #fff; background: var(--purple); }
  .page { display: none; } .page.active { display: block; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 40px; }
  #uploadArea { border: 2px dashed var(--border); padding: 40px; text-align: center; cursor: pointer; border-radius: 12px; margin-top: 20px; color: var(--text3); }
</style>
</head>
<body>
<div class="sidebar">
  <h1>社群數據分析</h1>
  <div class="nav-item active" onclick="showPage('dashboard')">總覽儀表板</div>
  <div class="nav-item" onclick="showPage('upload')">數據匯入</div>
</div>
<div class="main">
  <div id="page-dashboard" class="page active">
    <div class="card">
        <h2 id="statsTitle">數據分析結果</h2>
        <div id="result">請上傳您的 CSV 檔案以開始分析...</div>
    </div>
  </div>
  <div id="page-upload" class="page">
    <div class="card">
        <h3>匯入 FB 數據</h3>
        <div class="upload-area" id="uploadArea">點擊或拖曳 CSV 檔案至此</div>
        <input type="file" id="fileInput" style="display:none">
    </div>
  </div>
</div>

<script>
// 核心：工業級 CSV 解析器，完美處理換行問題
function parseCSV(text) {
    const lines = [], row = [], cur = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
        else if ((c === '\n') && !inQ) { row.push(cur.trim()); if(row.some(x=>x)) lines.push(row); row = []; cur = ''; }
        else cur += c;
    }
    const headers = lines[0];
    return lines.slice(1).map(l => { const o = {}; headers.forEach((h, i) => o[h] = l[i]); return o; });
}

// 核心：智慧欄位偵測，防網址、防錯位
function processData(rows) {
    return rows.map(r => {
        let title = (r['標題'] || r['說明'] || '未命名內容');
        if (title.includes('http')) title = '內容摘要'; // 過濾網址
        return { title: title.substring(0, 20), reach: parseFloat(r['觸及人數'] || r['觸及'] || 0) };
    }).filter(r => r.reach > 0);
}

document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
    const reader = new FileReader();
    reader.onload = e => {
        const data = processData(parseCSV(e.target.result));
        document.getElementById('result').innerText = `已成功分析 ${data.length} 筆貼文，總觸及：${data.reduce((a,b)=>a+b.reach, 0)}`;
        showPage('dashboard');
    };
    reader.readAsText(e.target.files[0]);
});

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    event.target.classList.add('active');
}
</script>
</body>
</html>
