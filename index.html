<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI 社群分析中心</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F9F8F6; --text: #1C1917; --purple: #7C62A3; --border: #E6E1DA; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); display: flex; margin: 0; }
  .sidebar { width: 220px; height: 100vh; background: var(--text); color: #fff; padding: 20px; position: fixed; }
  .main { margin-left: 220px; padding: 40px; width: calc(100% - 220px); }
  .card { background: #fff; padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .nav-item { padding: 12px; cursor: pointer; color: #aaa; font-size: 14px; border-radius: 8px; transition: 0.2s; }
  .nav-item.active { color: #fff; background: var(--purple); }
  .page { display: none; } .page.active { display: block; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 20px; }
  .upload-area { border: 2px dashed var(--border); padding: 40px; text-align: center; cursor: pointer; border-radius: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="sidebar">
  <h1>分析中心</h1>
  <div class="nav-item active" onclick="showPage('dashboard')">總覽儀表板</div>
  <div class="nav-item" onclick="showPage('upload')">上傳 CSV</div>
</div>
<div class="main">
  <div id="page-dashboard" class="page active">
    <div class="card"><h2 id="statsTitle">數據看板</h2><div id="result">請上傳資料以開始分析...</div></div>
  </div>
  <div id="page-upload" class="page">
    <div class="card">
        <h3>資料匯入</h3>
        <div class="upload-area" id="uploadArea">拖曳 CSV 到這裡</div>
        <input type="file" id="fileInput" style="display:none">
    </div>
  </div>
</div>

<script>
// 核心解析邏輯：強制過濾亂碼與網址
function parseAndAnalyze(text) {
    const lines = text.split('\n');
    const headers = lines[0].split(',');
    const results = lines.slice(1).map(line => {
        const row = line.split(',');
        let title = "未命名";
        // 搜尋標題欄位
        headers.forEach((h, i) => {
            if (h.includes('標題') || h.includes('說明')) {
                if (row[i] && !row[i].includes('http')) title = row[i];
            }
        });
        return { title: title.replace(/['"]+/g, ''), reach: parseFloat(row[2] || 0) };
    }).filter(r => r.reach > 0);
    return results;
}

document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
    const reader = new FileReader();
    reader.onload = e => {
        const data = parseAndAnalyze(e.target.result);
        document.getElementById('result').innerText = `成功分析 ${data.length} 筆貼文，總觸及：${data.reduce((a,b)=>a+b.reach,0)}`;
        showPage('dashboard');
    };
    reader.readAsText(e.target.files[0]);
});

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    event.target.classList.add('active');
}
</script>
</body>
</html>
